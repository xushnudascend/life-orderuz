<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Life Order</title>
    <style>
      html, body { margin: 0; padding: 0; background: #0A0A0A; color: #F5F5F5; font-family: system-ui, -apple-system, "Karla", sans-serif; }
      .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
      .card { max-width: 420px; text-align: center; }
      h1 { font-family: "Times New Roman", serif; font-size: 40px; line-height: 1.1; margin: 0 0 12px; letter-spacing: -0.01em; }
      p { color: #A3A3A3; line-height: 1.6; margin: 0 0 20px; }
      button { background: #D8FF00; color: #0A0A0A; border: 0; padding: 12px 22px; border-radius: 14px; font-weight: 600; cursor: pointer; }
      .tag { color: #D8FF00; font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; margin-bottom: 12px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="tag">Ulanish yo'q</div>
        <h1>Internet aloqasi uzildi.</h1>
        <p>Ba'zi sahifalar bepul rejimda ochiq. Aloqa tiklanganda ilova o'zi qaytadi.</p>
        <button onclick="location.reload()">Qayta urinib ko'rish</button>
      </div>
    </div>
  </body>
</html>
